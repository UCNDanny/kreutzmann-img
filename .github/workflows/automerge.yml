name: Auto-merge dependency updates
on:
  workflow_run:
    workflows: ["Build, validate, and release"]
    types: [completed]
permissions: {}
concurrency:
  group: automerge-dependencies
  cancel-in-progress: false
jobs:
  merge:
    # Only a successful validation of the autobump.yml branch qualifies.
    # Runs for main, other branches, and forks are ignored.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'automation/dependencies' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Squash-merge the validated dependency PR and release from main
        env:
          # A PAT merge, unlike GITHUB_TOKEN, triggers the push release on main.
          GH_TOKEN: ${{ secrets.PR_BOT_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          number=$(gh pr list --repo "$REPO" --head automation/dependencies \
            --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "No open PR for automation/dependencies; nothing to merge."
            exit 0
          fi
          gh pr merge "$number" --repo "$REPO" --squash --delete-branch
