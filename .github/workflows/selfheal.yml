name: Self-heal failed builds
on:
  workflow_run:
    workflows: ["Build, validate, and release"]
    types: [completed]
permissions:
  actions: write
concurrency:
  group: selfheal-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  heal:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # First failure: assume a transient registry/network error and retry.
      # Repeated failure: usually a new fixable CVE in a pinned base image, so
      # refresh the lock; autobump opens the PR, validates it, and automerge ships it.
      - name: Retry, then refresh dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          if [ "${ATTEMPT}" -lt 2 ]; then
            gh run rerun "${RUN_ID}" --repo "${REPO}" --failed
          else
            gh workflow run autobump.yml --repo "${REPO}" --ref main
          fi
