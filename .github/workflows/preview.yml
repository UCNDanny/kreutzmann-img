name: Keycloak preview-org image
# Hardens ghcr.io/ucndanny/keycloak-preview:latest (the org-picker preview built from
# UCNDanny/keycloak) into ghcr.io/<owner>/keycloak-preview-org. Kept separate from
# release.yml so a preview failure can never block the keycloak/oauth2-proxy releases.
on:
  pull_request:
    paths:
      - Dockerfile.keycloak-preview
      - dependencies.lock.json
      - scripts/**
      - tests/**
      - .github/workflows/preview.yml
  push:
    branches: [main]
    paths:
      - Dockerfile.keycloak-preview
      - dependencies.lock.json
      - scripts/**
      - tests/**
      - .github/workflows/preview.yml
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.source.outputs.source }}
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Pin the preview source to one digest for every architecture
        id: source
        run: |
          set -euo pipefail
          ref=ghcr.io/ucndanny/keycloak-preview:latest
          digest=$(docker buildx imagetools inspect "${ref}" --format '{{.Manifest.Digest}}')
          echo "source=${ref}@${digest}" >> "$GITHUB_OUTPUT"
  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - run: python3 -m unittest discover -s tests -v
      - name: Build natively from the pinned preview source and locked inputs
        run: python3 scripts/dependencies.py --build keycloak-preview --preview-image '${{ needs.resolve.outputs.source }}' --platform 'linux/${{ matrix.arch }}'
      - name: Smoke test the built image under runtime restrictions
        run: python3 scripts/smoke.py keycloak-preview
      - name: Record all vulnerability findings before filtering
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kreutzmann-img/keycloak-preview:local
          scanners: vuln
          format: json
          output: vulnerabilities.json
          exit-code: '0'
      - name: Block publication on fixable vulnerabilities at any severity
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kreutzmann-img/keycloak-preview:local
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          exit-code: '1'
          format: table
      - name: Preserve vulnerability report even when the gate fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-keycloak-preview-${{ matrix.arch }}
          path: vulnerabilities.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Generate per-architecture SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kreutzmann-img/keycloak-preview:local
          format: spdx-json
          output: sbom.spdx.json
          exit-code: '0'
      - name: Export the tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save kreutzmann-img/keycloak-preview:local -o image.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: tested-keycloak-preview-${{ matrix.arch }}
          path: |
            image.tar
            sbom.spdx.json
          retention-days: 3
          compression-level: 0
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tested-keycloak-preview-${{ matrix.arch }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Publish the tested bytes, without rebuilding or executing them
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          ARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="ghcr.io/${OWNER,,}/keycloak-preview-org"
          tag="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"
          skopeo copy --retry-times 5 --format oci \
            --dest-creds "${GITHUB_ACTOR}:${GITHUB_TOKEN}" \
            docker-archive:image.tar "docker://${name}:${tag}"
          digest=$(docker buildx imagetools inspect "${name}:${tag}" --format '{{.Manifest.Digest}}')
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the published architecture digest
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"
      - name: Attest the SBOM to the registry
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE_NAME}@${IMAGE_DIGEST}"
  index:
    needs: [resolve, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Publish and sign the multi-platform index
        env:
          OWNER: ${{ github.repository_owner }}
          SOURCE: ${{ needs.resolve.outputs.source }}
        run: |
          set -euo pipefail
          name="ghcr.io/${OWNER,,}/keycloak-preview-org"
          tag="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for attempt in 1 2 3 4 5; do
            docker buildx imagetools create -t "${name}:${tag}" -t "${name}:latest" \
              "${name}:${tag}-amd64" "${name}:${tag}-arm64" && break
            [ "${attempt}" -eq 5 ] && { echo "imagetools create failed after ${attempt} attempts" >&2; exit 1; }
            sleep "$((attempt * 15))"
          done
          digest=$(docker buildx imagetools inspect "${name}:${tag}" --format '{{.Manifest.Digest}}')
          cosign sign --yes "${name}@${digest}"
          echo "### keycloak-preview-org" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy: \`${name}@${digest}\` (also \`:latest\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "Built from: \`${SOURCE}\`" >> "$GITHUB_STEP_SUMMARY"
