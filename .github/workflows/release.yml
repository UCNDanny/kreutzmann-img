name: Build, validate, and release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        image: [oauth2-proxy, keycloak]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - run: python3 -m unittest discover -s tests -v
      - name: Build natively from locked inputs
        run: python3 scripts/dependencies.py --build '${{ matrix.image }}' --platform 'linux/${{ matrix.arch }}'
      - name: Smoke test the built image under runtime restrictions
        run: python3 scripts/smoke.py '${{ matrix.image }}'
      - name: Record all vulnerability findings before filtering
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kreutzmann-img/${{ matrix.image }}:local
          scanners: vuln
          format: json
          output: vulnerabilities.json
          exit-code: '0'
      - name: Block publication on fixable vulnerabilities at any severity
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kreutzmann-img/${{ matrix.image }}:local
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          trivyignores: ${{ matrix.image == 'oauth2-proxy' && '.trivyignore-oauth2-proxy.yaml' || '' }}
          exit-code: '1'
          format: table
      - name: Preserve vulnerability report even when the gate fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-${{ matrix.image }}-${{ matrix.arch }}
          path: vulnerabilities.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Generate per-architecture SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kreutzmann-img/${{ matrix.image }}:local
          format: spdx-json
          output: sbom.spdx.json
          exit-code: '0'
      - name: Export the tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save 'kreutzmann-img/${{ matrix.image }}:local' -o image.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: tested-${{ matrix.image }}-${{ matrix.arch }}
          path: |
            image.tar
            sbom.spdx.json
          retention-days: 3
          compression-level: 0
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        image: [oauth2-proxy, keycloak]
        arch: [amd64, arm64]
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tested-${{ matrix.image }}-${{ matrix.arch }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Publish the tested bytes, without rebuilding or executing them
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="ghcr.io/${OWNER,,}/${IMAGE}"
          tag="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"
          # image.tar holds the exact bytes smoke-tested in the build job, saved
          # under "kreutzmann-img/${IMAGE}:local" by scripts/dependencies.py. Copy
          # it to GHCR straight from the archive: no rebuild, no execution, no
          # local daemon. --format oci rewrites the docker-save schema2 manifest
          # to OCI media types so the multi-arch index the "index" job builds on
          # top is an OCI image index -- a legacy Docker manifest list cannot be
          # analyzed by Docker Scout or Docker Desktop's containerd image store.
          # --retry-times covers GHCR's intermittent 5xx on the manifest PUT.
          skopeo copy --retry-times 5 --format oci \
            --dest-creds "${GITHUB_ACTOR}:${GITHUB_TOKEN}" \
            docker-archive:image.tar "docker://${name}:${tag}"
          digest=$(docker buildx imagetools inspect "${name}:${tag}" --format '{{.Manifest.Digest}}')
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the published architecture digest
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"
      # Keyless Cosign SBOM attestation. Uses the same GitHub OIDC identity as
      # signing and works on a user-owned private repo, so every published image
      # carries an SBOM attestation regardless of plan.
      - name: Attest the SBOM to the registry
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE_NAME}@${IMAGE_DIGEST}"
      # GitHub-native artifact attestations add SLSA build provenance and a second
      # SBOM attestation. GitHub only issues these for a public repo or an
      # org/Enterprise plan, so they self-skip on a user-owned private repo.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
  index:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        image: [oauth2-proxy, keycloak]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Publish and sign the multi-platform index
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          name="ghcr.io/${OWNER,,}/${IMAGE}"
          tag="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # The upstream application version this image packages, read straight
          # from the reviewed lock file. ":latest" and ":<version>" are movable
          # pointers refreshed on every rebuild (base-image CVE patches included);
          # the "@sha256:..." digest is the only immutable reference.
          if [ "${IMAGE}" = keycloak ]; then key=keycloak; else key=oauth2_proxy; fi
          version=$(python3 -c 'import json,sys; print(json.load(open("dependencies.lock.json"))[sys.argv[1]]["version"])' "${key}")
          for attempt in 1 2 3 4 5; do
            docker buildx imagetools create \
              -t "${name}:${tag}" -t "${name}:latest" -t "${name}:${version}" \
              "${name}:${tag}-amd64" "${name}:${tag}-arm64" && break
            [ "${attempt}" -eq 5 ] && { echo "imagetools create failed after ${attempt} attempts" >&2; exit 1; }
            echo "attempt ${attempt} failed; retrying in $((attempt * 15))s" >&2
            sleep "$((attempt * 15))"
          done
          # imagetools create keeps the input media types; the per-arch tags are
          # pushed as OCI, so the index must be an OCI image index. Fail loudly if
          # a legacy Docker manifest list ever slips back in -- Docker Scout and
          # Docker Desktop cannot analyze that shape.
          media=$(docker buildx imagetools inspect "${name}:${tag}" --raw \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["mediaType"])')
          [ "${media}" = application/vnd.oci.image.index.v1+json ] \
            || { echo "published index is ${media}, not an OCI image index" >&2; exit 1; }
          digest=$(docker buildx imagetools inspect "${name}:${tag}" --format '{{.Manifest.Digest}}')
          cosign sign --yes "${name}@${digest}"
          echo "### ${IMAGE}" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy: \`${name}@${digest}\` (also \`:latest\`, \`:${version}\`)" >> "$GITHUB_STEP_SUMMARY"
