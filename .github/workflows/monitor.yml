name: Monitor dependencies and vulnerabilities
on:
  schedule:
    - cron: '0 3 * * *'
      timezone: 'America/Nuuk'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
  issues: write
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Read the locked scanner version
        id: scanner
        run: echo "version=v$(jq -r .trivy_version dependencies.lock.json)" >> "$GITHUB_OUTPUT"
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ steps.scanner.outputs.version }}
      # A multi-platform tag resolves to one platform by default, so scan each one.
      - name: Scan every published image and platform
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for image in oauth2-proxy keycloak openbao; do
            ignore=()
            [ "$image" != keycloak ] && ignore=(--ignorefile ".trivyignore-$image.yaml")
            for arch in amd64 arm64; do
              trivy image --quiet --scanners vuln --ignore-unfixed --platform "linux/$arch" \
                "${ignore[@]}" --format json --output "$image-$arch.json" \
                "ghcr.io/${OWNER,,}/$image:latest"
            done
          done
      - name: Report upstream updates and fixable vulnerabilities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/monitor.py \
            oauth2-proxy=oauth2-proxy-amd64.json oauth2-proxy=oauth2-proxy-arm64.json \
            keycloak=keycloak-amd64.json keycloak=keycloak-arm64.json \
            openbao=openbao-amd64.json openbao=openbao-arm64.json > report.md
      # One standing issue: opened when there is something to act on, commented on
      # whenever the report changes, and closed once everything is addressed.
      - name: Open, update, or close the monitor issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TITLE: Dependency and vulnerability monitor
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create monitor --repo "$REPO" --color D93F0B \
            --description 'Opened by the monitor workflow' 2>/dev/null || true
          number=$(gh issue list --repo "$REPO" --label monitor --state open \
            --json number --jq '.[0].number // empty')
          if [ ! -s report.md ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --repo "$REPO" --comment "Nothing left to act on as of $RUN_URL."
            fi
            exit 0
          fi
          printf '\n\n_Last checked: %s_\n' "$RUN_URL" > footer.md
          cat report.md footer.md > body.md
          if [ -z "$number" ]; then
            gh issue create --repo "$REPO" --title "$TITLE" --label monitor --body-file body.md
          elif ! gh issue view "$number" --repo "$REPO" --json body --jq .body \
              | sed '/^_Last checked:/,$d' | diff -qB - report.md >/dev/null; then
            gh issue edit "$number" --repo "$REPO" --body-file body.md
            gh issue comment "$number" --repo "$REPO" --body-file report.md
          else
            gh issue edit "$number" --repo "$REPO" --body-file body.md
          fi
  updates:
    needs: report
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Resolve upstream versions, checksums and base digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/dependencies.py --update
      - name: Validate generated build inputs
        run: python3 -m unittest discover -s tests -v
      # A PR opened with the workflow token waits for approval before its checks run; one opened
      # with a personal token does not.
      - name: Open or refresh the dependency update PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.UPDATE_PR_TOKEN }}
          branch: automation/dependency-updates
          delete-branch: true
          add-paths: |
            dependencies.lock.json
            Dockerfile.*
          commit-message: 'chore(deps): refresh verified image build inputs'
          title: 'chore(deps): update image dependencies and security scanner'
          body: |
            Refresh upstream releases, verified archive hashes, Go security dependencies,
            base-image digests and the Trivy scanner. The FIPS module remains manually pinned.

            The build workflow runs on this PR to build, smoke-test and scan
            all three images on AMD64 and ARM64. Review its results before merging.
            A passing workflow does not approve this PR or deploy production services.
            Review major/minor upgrades and any existing Java/Debian overrides explicitly.
