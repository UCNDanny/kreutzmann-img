name: Upstream dependency updates
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: dependency-updates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Resolve stable releases, Go patches, providers, and base digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/dependencies.py --update
      - name: Validate dependency lock
        run: python3 -m unittest discover -s tests -v
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        id: pr
        with:
          token: ${{ github.token }}
          branch: automation/dependencies
          title: 'Update hardened image dependencies'
          commit-message: 'Update verified upstream artifacts and base-image digests'
          add-paths: |
            dependencies.lock.json
            Dockerfile.keycloak
            Dockerfile.oauth2-proxy
          body: |
            Updates stable oauth2-proxy and Keycloak releases, compatible Go patches,
            Keycloak-declared BCFIPS providers, and pinned base-image digests.
            Review cryptographic-module validation conditions before merging.
            Go FIPS module version is deliberately not auto-upgraded.
            Upstream notes: https://github.com/oauth2-proxy/oauth2-proxy/releases
            Keycloak notes: https://github.com/keycloak/keycloak/releases
      # GITHUB_TOKEN-created PRs do not trigger pull_request workflows. An explicit
      # dispatch does trigger validation, while publishing remains default-branch-only.
      - name: Dispatch validation of the bot branch
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref automation/dependencies
