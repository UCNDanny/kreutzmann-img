name: Upstream dependency updates
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-updates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Resolve stable releases, Go patches, providers, and base digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/dependencies.py --update
      - name: Validate dependency lock
        run: python3 -m unittest discover -s tests -v
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: pr
        with:
          # A PAT, unlike GITHUB_TOKEN, makes the PR trigger its pull_request validation.
          token: ${{ secrets.PR_BOT_TOKEN }}
          branch: automation/dependencies
          title: 'Update hardened image dependencies'
          commit-message: 'Update verified upstream artifacts and base-image digests'
          add-paths: |
            dependencies.lock.json
            Dockerfile.keycloak
            Dockerfile.oauth2-proxy
          body: |
            Updates stable oauth2-proxy and Keycloak releases, compatible Go patches,
            Keycloak-declared BCFIPS providers, and pinned base-image digests.
            Review cryptographic-module validation conditions before merging.
            Go FIPS module version is deliberately not auto-upgraded.
            Upstream notes: https://github.com/oauth2-proxy/oauth2-proxy/releases
            Keycloak notes: https://github.com/keycloak/keycloak/releases
